<h2>الأطباء</h2>
<div id="doctorsList"></div>

<h3>حجز موعد</h3>
<div id="myStatus"></div>

<div id="myBooking"></div>

<script>
let allDoctors = [];

// تسجيل
document.getElementById("doctorForm").addEventListener("submit", function(e) {
  e.preventDefault();

  fetch("https://doctor-api-xmkb.onrender.com/register-doctor", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
  name: document.getElementById("name").value,
  email: document.getElementById("email").value,
  password: document.getElementById("password").value,
  phone: document.getElementById("phone").value,
  specialty: document.getElementById("specialty").value,
  location: document.getElementById("location").value
})
  })
  .then(res => res.text())
  .then(alert);
});

// login
function login() {
  fetch("https://doctor-api-xmkb.onrender.com/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      email: loginEmail.value,
      password: loginPassword.value
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      localStorage.setItem("doctorId", data.id);
      window.location.href = "dashboard.html";
    } else {
      alert("خطأ");
    }
  });
}

// عرض الأطباء
function loadDoctors() {
  fetch("https://doctor-api-xmkb.onrender.com/doctors")
    .then(res => res.json())
    .then(data => {
      allDoctors = data;
filterDoctors();   
 });
}
function renderDoctors(list) {
  const c = document.getElementById("doctorsList");
  c.innerHTML = "";

  list.forEach(doc => {
    const div = document.createElement("div");

    div.className = "doctor-card";

    div.innerHTML = `
      <div class="doctor-name">${doc.name || "بدون اسم"}</div>
      <div class="doctor-specialty">${doc.specialty || "بدون تخصص"}</div>
      <div class="doctor-wilaya">${doc.location || "بدون ولاية"}</div>
      <div>الدور: ${doc.current_number}</div>
      <button onclick="book(${doc.id})">حجز</button>
    `;

    c.appendChild(div);
  });
}

function filterDoctors() {
  const name = document.getElementById("searchName").value.toLowerCase();
  const specialty = document.getElementById("searchSpecialty").value.toLowerCase();
  const wilaya = document.getElementById("searchWilaya").value.toLowerCase();

  const filtered = allDoctors.filter(doc =>
    (doc.name || "").toLowerCase().includes(name) &&
    (doc.specialty || "").toLowerCase().includes(specialty) &&
    (doc.location || "").toLowerCase().includes(wilaya)
  );

  renderDoctors(filtered);
}

document.getElementById("searchName").addEventListener("input", filterDoctors);
document.getElementById("searchSpecialty").addEventListener("input", filterDoctors);
document.getElementById("searchWilaya").addEventListener("change", filterDoctors);

// حجز
function book(id) {
  const name = document.getElementById("patientName").value;

  // ✅ تحقق مهم
  if (!name) {
    alert("اكتب اسمك قبل الحجز");
    return;
  }

  localStorage.setItem("doctorId", id);
  localStorage.setItem("patientName", name);

  fetch("https://doctor-api-xmkb.onrender.com/book-appointment", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      doctorId: id,
      patientName: name
    })
  })
  .then(() => {
    setTimeout(() => {
      fetch(`https://doctor-api-xmkb.onrender.com/appointments/${id}`)
        .then(res => res.json())
        .then(list => {

          const last = list[list.length - 1];

          if (last) {
            document.getElementById("myBooking").innerText =
              "الحالة: " + last.status + " | رقمك: " + (last.number || "انتظر القبول");
          }

        });
    }, 500); // ⏱ هذا عادي خليه
  });
}
setInterval(() => {
  const name = localStorage.getItem("patientName");
  const doctorId = localStorage.getItem("doctorId");

  if (!name || !doctorId) return;

  fetch(`https://doctor-api-xmkb.onrender.com/my-appointment/${doctorId}/${name}`)
    .then(res => res.json())
    .then(app => {

      if (app) {
        document.getElementById("myBooking").innerText =
          "الحالة: " + app.status + " | رقمك: " + (app.number || "انتظر القبول");
      } else {
        document.getElementById("myBooking").innerText = "لا يوجد حجز";
      }

    });

}, 2000);
</script>
